name: ci

# Free-minute budget: run checks only after merge to main (push), not on every PR.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go toolchain from version.txt
        id: goversion
        run: |
          set -euo pipefail
          GO_VERSION="$(tr -d '[:space:]' < version.txt)"
          MOD="$(sed -n 's/^go //p' go.mod | head -1 | tr -d '[:space:]')"
          if [ -z "$GO_VERSION" ]; then
            echo "::error::empty version.txt" >&2
            exit 1
          fi
          if [ "$GO_VERSION" != "$MOD" ]; then
            echo "::error::go.mod ($MOD) != version.txt ($GO_VERSION)" >&2
            exit 1
          fi
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goversion.outputs.go_version }}
          cache: true

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Go toolchain
        id: goversion
        run: |
          set -euo pipefail
          GO_VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Resolve build identity
        id: build
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            BRANCH_RAW="$GITHUB_HEAD_REF"
          else
            BRANCH_RAW="$GITHUB_REF_NAME"
          fi
          BRANCH="$(printf '%s' "$BRANCH_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]/-/g' | sed -E 's/-+/-/g' | sed -E 's/^-+|-+$//g')"
          if [ -z "$BRANCH" ]; then
            BRANCH=unknown
          fi
          BUILD_ID="${BRANCH}-${SHORT_SHA}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Docker build (lux-l7)
        run: |
          docker build \
            --build-arg GO_VERSION="${{ steps.goversion.outputs.go_version }}" \
            --build-arg BIN=lux-l7 \
            --build-arg BUILD_ID="${{ steps.build.outputs.build_id }}" \
            -t lux-l7:ci .
